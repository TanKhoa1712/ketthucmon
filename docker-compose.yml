
services:
  postgres:
    image: postgres:16
    container_name: web-ban-hang-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: webbanhang
      POSTGRES_PASSWORD: webbanhang_dev_2026
      POSTGRES_DB: webbanhang
    ports:
      - "5432:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webbanhang -d webbanhang"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: web-ban-hang-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:3000,http://localhost:5173
      DATABASE_URL: postgresql://webbanhang:webbanhang_dev_2026@postgres:5432/webbanhang?schema=public
      JWT_SECRET: local_development_secret_change_before_production_2026
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: web-ban-hang-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  du_lieu_postgres:
